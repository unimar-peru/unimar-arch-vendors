name: Gobernanza

# Los gates que solo corren en el pre-commit local (evadible con --no-verify, e
# inexistente si nadie configuro core.hooksPath) se ejecutan aqui, en el
# servidor, donde nadie los puede saltar. Es el limite de merge inevadible.
#
# El estandar Unimar no vive en una copia local (.harness/): lo provee el plugin
# unimar-core. En los demas satelites el runner lo obtiene haciendo checkout del
# marketplace con un token de la GitHub App unimar-ci.
#
# AQUI NO. unimar-arch-vendors es el unico repositorio PUBLICO de la
# organizacion, y los secretos de organizacion tienen visibilidad "private": un
# repositorio publico no los recibe. El checkout caia al github.token, que no
# alcanza el marketplace privado, y el CI fallaba con "Repository not found".
# Exponer la clave privada de la App a un repo publico se descarto: cualquiera
# con escritura podria exfiltrarla editando un workflow.
#
# Los validadores estan por tanto COMMITEADOS en .estandar/, fijados a una
# etiqueta. Ver .estandar/PROCEDENCIA.txt para el origen exacto y como
# regenerarlos. Es una divergencia consciente de S-16, registrada en
# DECISIONS.md y en GAPS.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Ruta de los validadores commiteados. La version que representan esta en
  # .estandar/PROCEDENCIA.txt; subirla es un commit aqui, revisable como
  # cualquier otro, igual que lo era mover STANDARD_REF.
  UNIMAR_CORE_PATH: .estandar/plugins/unimar-core

jobs:
  gobernanza:
    name: Validadores del estandar
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- validate-trazabilidad recorre el historial y comprueba
      # con `git cat-file` que los hashes de evidencia de los gaps cerrados
      # existan. Con el clon superficial por defecto (profundidad 1) no estan, y
      # el gate reportaria como colgante toda evidencia legitima.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22 como minimo: los validadores usan `glob` de node:fs/promises.
          node-version: '24'

      - name: Ruta de los validadores
        run: echo "UNIMAR_CORE=$GITHUB_WORKSPACE/${{ env.UNIMAR_CORE_PATH }}" >> "$GITHUB_ENV"

      # Sin --fix: modo verificacion. Falla si MADUREZ.md o GAPS.md no estan
      # normalizados, en vez de arreglarlos en silencio.
      - name: Madurez medida y con evidencia (S-19)
        run: node "$UNIMAR_CORE/scripts/validate-madurez.mjs"

      - name: Registro de gaps valido y ordenado (S-20)
        run: node "$UNIMAR_CORE/scripts/validate-gaps.mjs"

      - name: Cada casilla de madurez < 5 tiene su gap (S-19, S-20)
        run: node "$UNIMAR_CORE/scripts/validate-correspondencia.mjs"

      - name: Encoding, texto mutilado, enlaces y anclas (S-09, S-10, SD-06)
        run: node "$UNIMAR_CORE/scripts/validate-docs.mjs"

      - name: Ninguna referencia G-NNN o ADR-NNNN cuelga (SD-02)
        run: node "$UNIMAR_CORE/scripts/validate-trazabilidad.mjs"

      # Aviso, no puerta: este repo es un paquete documental (plantillas y
      # ejemplos con placeholders), no un satelite de producto con artefactos
      # reales. El validador los juzga como artefactos y produce falsos
      # positivos -- el propio plugin unimar-core falla igual sobre sus
      # plantillas. Ver DECISIONS.md D-003. Se corre por visibilidad.
      - name: Estructura de los artefactos SDLC (S-01..S-05, S-13, aviso)
        continue-on-error: true
        run: node "$UNIMAR_CORE/scripts/validate-satellite-base.mjs"

      # Los validadores que llegan con unimar-core-1.90.0. Se encadenan porque
      # adoptar una regla cuya puerta no corre es lo que ADR-0184 impide: aqui
      # el triaje de DECISIONS.md dice `Adopt` de diecisiete reglas, y esto es
      # lo que sostiene esa palabra.
      - name: Numeracion de identificadores entre ramas (S-26)
        run: node "$UNIMAR_CORE/scripts/validate-identificadores.mjs"

      - name: Numeracion de ADR entre ramas (S-26)
        run: node "$UNIMAR_CORE/scripts/validate-adr-numeracion.mjs"

      - name: La vinculacion al estandar esta declarada (S-28)
        run: node "$UNIMAR_CORE/scripts/validate-vinculacion-estandar.mjs"

      - name: El dato personal no llega al log (S-34)
        run: node "$UNIMAR_CORE/scripts/validate-redaccion-log.mjs"

      - name: La vigencia se declara donde puede sostenerse (S-35)
        run: node "$UNIMAR_CORE/scripts/validate-vigencia.mjs"

      - name: La senal declara cuanto dura y quien la altera (S-36)
        run: node "$UNIMAR_CORE/scripts/validate-retencion-senal.mjs"

      - name: El analizador estatico se declara por runtime (S-37)
        run: node "$UNIMAR_CORE/scripts/validate-analisis-estatico.mjs"

      - name: El ambito de runtime de un ADR se declara (S-38)
        run: node "$UNIMAR_CORE/scripts/validate-ambito-runtime.mjs"

      - name: El PRD y la historia tecnica declaran sus secciones (S-39)
        run: node "$UNIMAR_CORE/scripts/validate-secciones-prd-historia-tecnica.mjs"

      - name: El Blueprint dice que pasa si una dependencia cae (S-42)
        run: node "$UNIMAR_CORE/scripts/validate-comportamiento-degradado.mjs"

      - name: Ningun artefacto lleva una credencial dentro (S-43)
        run: node "$UNIMAR_CORE/scripts/validate-credencial-en-artefacto.mjs"

      # AVISO, no puerta. Este repositorio no autora ADRs: los 41 que hay bajo
      # `estandar/` son la copia curada del corpus de Unimar, y su indice es un
      # SUBCONJUNTO deliberado. El validador mide omisiones contra el disco y
      # denuncia cinco, que aqui no son un indice que miente sino una curaduria
      # que no se declara como tal. Mientras esa decision no se tome, bloquear
      # con ella seria acusar a este repositorio de cumplir su proposito (G-016).
      - name: Estado y supersesion de los ADR del espejo (S-27, S-29, aviso)
        continue-on-error: true
        run: node "$UNIMAR_CORE/scripts/validate-adr-status.mjs" estandar/reference/architecture/adrs

      - name: Las reglas de herencia estan triajadas (S-15, S-16)
        run: node "$UNIMAR_CORE/scripts/validate-triaje.mjs"

      # Estructura del satelite: CONTRIBUTING.md con bucle de retorno, raiz de
      # fuente declarada, esqueleto de la taxonomia, y ningun marcador sin
      # sustituir. Sin esta puerta, S-18 depende de que el operador la recuerde.
      - name: Estructura del satelite (S-16, S-18)
        run: node "$UNIMAR_CORE/scripts/validate-estructura-satelite.mjs"

      # Aviso, no puerta: la heuristica de SD-04 tiene falsos positivos. Sale 0
      # aunque encuentre candidatos; su salida se lee en el log del PR.
      - name: Criterios de aceptacion verificables (SD-04, aviso)
        run: node "$UNIMAR_CORE/scripts/validate-criterios.mjs"

      # Aviso, no puerta (ADR-0106 S6): los gates locales son la postura de
      # seguridad; este paso solo reporta si el satelite los cablea. La seguridad
      # no depende de este CI (P-LOCAL-02) — se corre aqui por visibilidad.
      - name: Gates locales de calidad y seguridad (S-23, aviso)
        run: node "$UNIMAR_CORE/scripts/validate-gates-locales.mjs"

      # Aviso: coherencia del modelo Suite -> Sistema -> PRD (ADR-0120), si el
      # satelite declara suite.yaml/sistema.yaml.
      - name: Modelo Suite -> Sistema -> PRD (ADR-0120, aviso)
        run: node "$UNIMAR_CORE/scripts/validate-suite.mjs"

      # AVISO, no puerta -- y es deuda declarada, no una exencion de diseno.
      # Este paso nunca llego a ejecutarse: el job moria antes, en "Obtener el
      # estandar", desde que el token dejo de alcanzar el marketplace. Al
      # arreglar aquello afloraron 4577 violaciones acumuladas en `estandar/`,
      # la documentacion que se distribuye al proveedor. Bloquear con esa deuda
      # dentro solo consigue que se ignore el rojo, que es peor que no tener
      # gate. Se degrada a aviso MIENTRAS se salda, y el pendiente esta en
      # GAPS.md (G-012). Volver a `continue-on-error: false` es parte de
      # cerrarlo: si esta linea sigue aqui cuando el contador llegue a cero, el
      # gate se habra perdido en silencio.
      - name: Lint de Markdown (aviso; deuda en G-012)
        continue-on-error: true
        run: >
          npx --yes markdownlint-cli@0.39.0
          --config .markdownlint.json
          --ignore .claude --ignore _bmad --ignore _bmad-output --ignore .estandar
          "**/*.md"

  # Job de build y pruebas del satelite (gate F3/F4 del SDLC).
  # unimar-arch-vendors es un paquete DOCUMENTAL para proveedores: no hay build
  # de codigo. La "prueba" es validar la documentacion que se distribuye.
  build-pruebas:
    name: Build y pruebas (documentacion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Ruta de los validadores
        run: echo "UNIMAR_CORE=$GITHUB_WORKSPACE/${{ env.UNIMAR_CORE_PATH }}" >> "$GITHUB_ENV"

      # Documentación: sin build de código
      - name: Pruebas de documentacion
        run: node "$UNIMAR_CORE/scripts/validate-docs.mjs"
